<script>
  function googleLogin() {
    // Return a Promise so Flutter can await it
    return new Promise((resolve, reject) => {
      if (!google?.accounts?.id) {
        reject("Google API not loaded");
        return;
      }

      google.accounts.id.initialize({
        client_id: "110545486777-b7m84fpdektn9u880fpf5geh05o48a0p.apps.googleusercontent.com",
        callback: (response) => {
          if (response && response.credential) {
            window.localStorage.setItem("google_token", response.credential);
            resolve(response.credential);
          } else {
            reject("No token received");
          }
        },
      });

      // Show the One Tap prompt
      google.accounts.id.prompt((notification) => {
        if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
          // optional: you can reject here or just ignore
          console.log("Google login prompt skipped or not displayed");
        }
      });
    });
  }

  function handleCredentialResponse(response) {
    // This is the Google JWT
    const token = response.credential;

    // Store token so Flutter can access it
    window.localStorage.setItem("google_token", token);
  }
</script>

  <script>
    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-initialized', function () {
      const loading = document.getElementById('loading');
      loading.classList.add('fade-out');
      setTimeout(() => {
        loading.style.display = 'none';
      }, 500);
    });

    // Fallback: Hide loading screen after 10 seconds if Flutter hasn't loaded
    setTimeout(() => {
      const loading = document.getElementById('loading');
      if (loading && loading.style.display !== 'none') {
        loading.classList.add('fade-out');
        setTimeout(() => {
          loading.style.display = 'none';
        }, 500);
      }
    }, 10000);
  </script>

  <script>
    // Override the Flutter loading callback to hide our custom loading screen
    if (typeof _flutter !== 'undefined') {
      const originalLoad = _flutter.loader.load;
      _flutter.loader.load = function (config) {
        return originalLoad.call(this, config).then((engineInitializer) => {
          return engineInitializer.initializeEngine(config).then((appRunner) => {
            // Hide loading screen when Flutter app is about to run
            const loading = document.getElementById('loading');
            if (loading) {
              loading.classList.add('fade-out');
              setTimeout(() => {
                loading.style.display = 'none';
              }, 500);
            }
            return appRunner;
          });
        });
      };
    }
  </script>
